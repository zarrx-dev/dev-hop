name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste your real `~/.ssh/config` or private paths; use made-up names.
  - type: input
    id: gnome
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
      placeholder: GNOME Shell 46.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and session
      placeholder: Ubuntu 24.04, Wayland
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dev-hop version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the search popup with Super+J
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl -b -o cat /usr/bin/gnome-shell | grep -i dev-hop`
      render: text
