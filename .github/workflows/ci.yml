name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gjs and GLib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin gir1.2-glib-2.0
      - name: Lint
        run: make lint
      - name: Compile schemas
        run: make schemas
      - name: Test
        run: make test
      - name: Pack
        run: |
          sudo apt-get install -y --no-install-recommends gnome-shell-common || true
          if command -v gnome-extensions >/dev/null; then make pack; else echo "gnome-extensions not available, skipping pack"; fi
